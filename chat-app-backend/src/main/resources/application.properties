spring.application.name=Chatify

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/chatify_db
spring.datasource.username=postgres
spring.datasource.password=Postgres@1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

chatify.jwt.secret=${CHATIFY_JWT_SECRET}
chatify.jwt.expiration-ms=86400000


