spring.application.name=Chatify

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/chatify_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

chatify.jwt.secret=${CHATIFY_JWT_SECRET}
chatify.jwt.expiration-ms=86400000


#$rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
#$bytes = New-Object byte[] 32
#$rng.GetBytes($bytes)
#$rng.Dispose()
#$secret = [Convert]::ToBase64String($bytes)
#
#$env:CHATIFY_JWT_SECRET = $secret]

logging.level.org.springframework.security=TRACE


# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=chatify-message-group
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka consumer configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.chatify.event.ChatMessageEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.chatify.event

# Kafka Streams configuration
spring.kafka.streams.application-id=chatify-streams

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379